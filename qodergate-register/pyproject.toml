[project]
name = "qodergate-register"
version = "0.1.0"
description = "Qoder 独立注册机（无限循环注册 + 自动导出）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "drissionpage>=4.1.1.4",
    "httpx>=0.27.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
qodergate-register = "qodergate_register.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qodergate_register"]
